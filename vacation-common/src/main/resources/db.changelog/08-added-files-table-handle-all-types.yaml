databaseChangeLog:

  - changeSet:
      id: create-centralized-files-table
      author: bhargav
      changes:

        - createTable:
            tableName: centralized_files
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: object_key
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(50)

              - column:
                  name: created_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            tableName: centralized_files
            columnNames: object_key
            constraintName: uq_centralized_files_object_key