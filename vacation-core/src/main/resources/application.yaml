spring:
  application:
    name: vacation-core

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: when_authorized

storage:
  bucket: ${STORAGE_BUCKET:vacation-uploads}
  region: ${STORAGE_REGION:ap-south-1}
  endpoint: ${STORAGE_ENDPOINT:http://localhost:4566}
  access-key: ${STORAGE_ACCESS_KEY:test}
  secret-key: ${STORAGE_SECRET_KEY:test}
  presign-expiry-minutes: ${STORAGE_PRESIGN_EXPIRY:15}
